# 地区节点组
# ==================================
🇭🇰 香港节点 = select,policy-regex-filter=^(?!.*CS)(?i)(?=.*(港|HK|Hong\s?Kong|🇭🇰)).*$,hidden=1
🇨🇳 台湾节点 = select,policy-regex-filter=^(?!.*CS)(?i)(?=.*(台|TW|Taiwan|Taipei|🇹🇼)).*$,hidden=1
🇸🇬 新加坡节点 = select,policy-regex-filter=^(?!.*CS)(?i)(?=.*(新|SG|Singapore|🇸🇬)).*$,hidden=1
🇯🇵 日本节点 = select,policy-regex-filter=^(?!.*CS)(?i)(?=.*(日|JP|Japan|Tokyo|🇯🇵)).*$,hidden=1
