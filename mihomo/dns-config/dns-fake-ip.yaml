# DNS 配置（fake-ip 模式）
#
# 
dns:
  enable: true
  cache-algorithm: lru   # DNS 缓存算法
  listen: "[::]:1053"
  ipv6: false
  respect-rules: true   # dns 连接遵守路由规则
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "geosite:connectivity-check"
    - "geosite:private"
  default-nameserver:
    - 223.5.5.5        # 阿里 DNS
    - 119.29.29.29     # 腾讯 DNS
    - 114.114.114.114  # 114 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT # 阿里 DoH
    - https://doh.pub/dns-query#DIRECT        # 腾讯 DoH
    # 如果你的网络环境对 DoH 干扰严重，可以退回使用标准 UDP 协议：
    # - 223.5.5.5      # 阿里 DNS
    # - 119.29.29.29   # 腾讯 DNS
  direct-nameserver:
    - system
    - 223.5.5.5        # 阿里 DNS
    - 119.29.29.29     # 腾讯 DNS
  nameserver:
    - https://doh.pub/dns-query#DIRECT
    - https://dns.alidns.com/dns-query#DIRECT